name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scheduled_qualification:
        description: Run the schedule-only HTTP/2 and WebSocket qualifications
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: flyology-http-ci-${{ github.ref }}
  cancel-in-progress: true

# Every step that reaches the network carries a timeout-minutes bound, so a
# stalled mirror or registry fails the step instead of hanging it. Without one
# the step runs until the job timeout -- 150 minutes for the HTTP/2 job -- and
# the run looks busy the whole time rather than failing and inviting a retry.
# The apt-get update below stalled three times on 2026-08-19: run 32226557711
# on main burned the entire 150-minute job budget before the job timeout ended
# it, and runs 32278682887 and 32294697524 sat there 83 and 64 minutes before
# someone cancelled them by hand. The same job finishes in 8 to 14 minutes when
# the mirror answers.
#
# The bounds are sized against the slowest healthy observation over the
# preceding 60 runs, with room to spare, so tripping one means a stall rather
# than a slow day. Checking out sources and configuring the index take seconds
# and are given 5 minutes. Installing the HTTP/2 peer takes 11 seconds at the
# median and 5 minutes at its slowest, so it is given 15. Installing Alire is
# given 15 for a different reason: every observation of it is a cache hit, and
# a cold run downloads a whole toolchain, so the observations do not bound it.

jobs:
  agent-packages:
    name: Agent package lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install APM
        run: pip install apm-cli==0.28.0
      - name: Reproduce agent resources
        run: |
          apm install --frozen
          apm compile --target codex,claude --clean
          apm audit --ci
          git diff --exit-code -- AGENTS.md apm.lock.yaml

  test:
    name: HTTP tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out sources
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        timeout-minutes: 15
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Configure Flyology index
        timeout-minutes: 5
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community
      - name: Use the in-tree QUIC prerequisite
        run: alr pin flyology_quic --use=flyology_quic
      # The WPT URL corpus that gates flyology_iri is third-party data, so it
      # is pinned by commit rather than followed by tag or branch. 32dabc8d is
      # the ada-url/ada revision flyology_iri/BENCHMARKS.md already pins as Ada
      # URL 4.0.0, so the conformance corpus and the published benchmark
      # medians come from one reviewed revision. It lands under build/, which
      # is ignored, so the checkout leaves no untracked files behind.
      - name: Check out the pinned WPT URL corpus
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ada-url/ada
          ref: 32dabc8d39a919633f31f692c358012b2105fd61
          path: build/ada-url
          persist-credentials: false
      - name: Run HTTP tests
        env:
          ADA_URL_ROOT: ${{ github.workspace }}/build/ada-url
          FLYOLOGY_IRI_REQUIRE_WPT: "1"
        run: ./scripts/test.sh
      - name: Check the WPT gate wiring
        run: ./flyology_iri/scripts/wpt-gate-test.sh

  hook-elision:
    name: Test-hook elision (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out sources
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        timeout-minutes: 15
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Configure Flyology index
        timeout-minutes: 5
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community
      - name: Use the in-tree QUIC prerequisite
        run: alr pin flyology_quic --use=flyology_quic
      - name: Check both hook selections and every optimization mode
        timeout-minutes: 20
        run: ./scripts/check-test-hook-elision.sh

  proof:
    name: SPARK proof
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out sources
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        timeout-minutes: 15
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Configure Flyology index
        timeout-minutes: 5
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community
      - name: Use the in-tree QUIC prerequisite
        run: alr pin flyology_quic --use=flyology_quic
      - name: Run SSE reconnect formal gate
        timeout-minutes: 15
        run: |
          tla_prefix="${RUNNER_TEMP}/flyology-tla"
          toolchain_root="${RUNNER_TEMP}/flyology-tla-toolchain"
          alr -n install --prefix="$tla_prefix" flyology_tla=0.1.0-dev
          tla_cli="$tla_prefix/bin/flyology-tla"
          "$tla_cli" toolchain install "$toolchain_root"
          "$tla_cli" toolchain verify "$toolchain_root"
          eval "$("$tla_cli" toolchain env "$toolchain_root")"
          FLYOLOGY_TLA_CLI="$tla_cli" ./scripts/check-sse-client-formal.sh
      - name: Prove QUIC and HTTP policy units
        env:
          FLYOLOGY_PROOF_LEVEL: "2"
        run: ./scripts/prove.sh

  http2-qualification:
    name: HTTP/2 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out sources
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        timeout-minutes: 15
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Configure Flyology index
        timeout-minutes: 5
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community
      - name: Use the in-tree QUIC prerequisite
        run: alr pin flyology_quic --use=flyology_quic
      - name: Install independent HTTP/2 peer
        timeout-minutes: 15
        run: |
          # apt-get update is the command that stalls, and it is the one here
          # that is safe to interrupt and repeat: a killed run leaves partial
          # package lists behind, which the next run refetches. Bounding each
          # attempt on its own turns a wedged mirror connection into a retry
          # against a fresh one, so a single transient failure does not fail
          # the job, and the step bound above stays a backstop rather than the
          # mechanism that catches the common case.
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=10s 120s apt-get update; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::apt-get update stalled or failed on all 3 attempts"
              exit 1
            fi
            echo "::warning::apt-get update attempt $attempt failed; retrying"
            sleep $((attempt * 15))
          done
          sudo apt-get install --yes nghttp2-server
          go version
          node --version
          nghttpd --version
      - name: Prepare HTTP/2 tester and runtime
        run: |
          ./scripts/http2-test.sh prepare
          ./scripts/http-client-differential.sh prepare
          ./scripts/test.sh
      - name: Run Ada/PycURL client differential
        run: ./scripts/http-client-differential.sh run
      - name: Run HTTP/2 qualification
        run: |
          if [ "${{ github.event_name }}" = schedule ] \
            || [ "${{ inputs.scheduled_qualification }}" = true ]; then
            ./scripts/http2-test.sh nightly
          else
            ./scripts/http2-test.sh qualification
          fi

  http3-qualification:
    name: QUIC and HTTP/3 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out sources
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        timeout-minutes: 15
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Configure Flyology index
        timeout-minutes: 5
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community
      - name: Use the in-tree QUIC prerequisite
        run: alr pin flyology_quic --use=flyology_quic
      - name: Report independent oracle versions
        run: |
          python3 --version
          go version
          sed -n '1,20p' tests/oracle/requirements.txt
          sed -n '1,20p' tests/oracle/quic-go/go.mod
      - name: Run QUIC and HTTP/3 interoperability qualification
        env:
          GOTOOLCHAIN: local
        run: ./scripts/test-http3-interop.sh all

  http3-conformance:
    name: HTTP/3 conformance and resilience
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out sources
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        timeout-minutes: 15
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Configure Flyology index
        timeout-minutes: 5
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community
      - name: Use the in-tree QUIC prerequisite
        run: alr pin flyology_quic --use=flyology_quic
      - name: Run published h3spec error suite
        run: ./scripts/test-http3-h3spec.sh
      - name: Run bounded HTTP/3 stress campaign
        run: ./scripts/test-http3-stress.sh

  websocket-conformance:
    name: WebSocket conformance (${{ matrix.profile }}, ${{ matrix.lane }})
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.scheduled_qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core
            lane: lightweight
          - profile: core
            lane: native
          - profile: core-wss
            lane: lightweight
          - profile: core-wss
            lane: native
          - profile: limits
            lane: lightweight
          - profile: limits
            lane: native
          - profile: compression
            lane: lightweight
          - profile: compression
            lane: native
          - profile: compression-wss
            lane: lightweight
          - profile: compression-wss
            lane: native
          - profile: performance
            lane: lightweight
          - profile: performance
            lane: native
          - profile: performance-wss
            lane: lightweight
          - profile: performance-wss
            lane: native
    steps:
      - name: Check out sources
        timeout-minutes: 5
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        timeout-minutes: 15
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Configure Flyology index
        timeout-minutes: 5
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community
      - name: Use the in-tree QUIC prerequisite
        run: alr pin flyology_quic --use=flyology_quic
      - name: Locate OpenSSL 3 modules
        if: contains(matrix.profile, '-wss')
        run: |
          ssl_library=$(ldconfig -p | awk '$1 == "libssl.so.3" && !found { print $NF; found=1 }')
          crypto_library=$(ldconfig -p | awk '$1 == "libcrypto.so.3" && !found { print $NF; found=1 }')
          test -n "$ssl_library"
          test -n "$crypto_library"
          library_directory=$(dirname -- "$ssl_library")
          test "$library_directory" = "$(dirname -- "$crypto_library")"
          printf 'FLYOLOGY_OPENSSL_LIBRARY_DIR=%s\n' "$library_directory" >> "$GITHUB_ENV"
      - name: Run Autobahn qualification
        run: ./scripts/websocket-conformance.sh "${{ matrix.profile }}" "${{ matrix.lane }}"
