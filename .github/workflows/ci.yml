name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"

permissions:
  contents: read

concurrency:
  group: flyology-http-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: HTTP tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Configure Flyology index
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community
      # The WPT URL corpus that gates flyology_iri is third-party data, so it
      # is pinned by commit rather than followed by tag or branch. 32dabc8d is
      # the ada-url/ada revision flyology_iri/BENCHMARKS.md already pins as Ada
      # URL 4.0.0, so the conformance corpus and the published benchmark
      # medians come from one reviewed revision. It lands under build/, which
      # is ignored, so the checkout leaves no untracked files behind.
      - name: Check out the pinned WPT URL corpus
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ada-url/ada
          ref: 32dabc8d39a919633f31f692c358012b2105fd61
          path: build/ada-url
          persist-credentials: false
      - name: Run HTTP tests
        env:
          ADA_URL_ROOT: ${{ github.workspace }}/build/ada-url
          FLYOLOGY_IRI_REQUIRE_WPT: "1"
        run: ./scripts/test.sh
      - name: Check the WPT gate wiring
        run: ./flyology_iri/scripts/wpt-gate-test.sh

  http2-qualification:
    name: HTTP/2 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Configure Flyology index
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community
      - name: Install independent HTTP/2 peer
        run: |
          sudo apt-get update
          sudo apt-get install --yes nghttp2-server
          go version
          node --version
          nghttpd --version
      - name: Prepare HTTP/2 tester and runtime
        run: |
          ./scripts/http2-test.sh prepare
          ./scripts/test.sh
      - name: Run HTTP/2 qualification
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            ./scripts/http2-test.sh nightly
          else
            ./scripts/http2-test.sh qualification
          fi

  http3-qualification:
    name: QUIC and HTTP/3 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Configure Flyology index
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community
      - name: Report independent oracle versions
        run: |
          python3 --version
          go version
          sed -n '1,20p' tests/oracle/requirements.txt
          sed -n '1,20p' tests/oracle/quic-go/go.mod
      - name: Run QUIC and HTTP/3 interoperability qualification
        env:
          GOTOOLCHAIN: local
        run: ./scripts/test-http3-interop.sh all

  http3-conformance:
    name: HTTP/3 conformance and resilience
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Configure Flyology index
        run: |
          alr index --reset-community
          alr index --add=git+https://github.com/flyology-ada/alire-index.git --name=flyology --before=community
      - name: Run published h3spec error suite
        run: ./scripts/test-http3-h3spec.sh
      - name: Run bounded HTTP/3 stress campaign
        run: ./scripts/test-http3-stress.sh
