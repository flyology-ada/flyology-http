name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: flyology-http-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site and API reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: flyology-http
          submodules: true
      - name: Install Alire
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Select toolchain
        run: |
          alr --non-interactive toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          printf 'ALR=%s\n' "$(command -v alr)" >> "$GITHUB_ENV"
      - name: Configure Flyology index
        run: |
          alr index --reset-community
          alr index \
            --add=git+https://github.com/flyology-ada/alire-index.git \
            --name=flyology \
            --before=community
      - name: Install GNATdoc
        run: alr install gnatdoc_bin
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build site
        run: ./scripts/build-site.sh
        working-directory: flyology-http
      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: flyology-http/build/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
